name: ITDA CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: 변경 사항 감지
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 변경된 파일 확인
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/workflows/**'

  backend:
    name: 백엔드 CI
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 환경 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      - name: 백엔드 빌드 및 테스트
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew build

  frontend:
    name: 프론트엔드 CI
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: frontend/pubspec.lock

      - name: 프론트엔드 의존성 설치
        working-directory: frontend
        run: flutter pub get

      - name: 프론트엔드 코드 분석
        working-directory: frontend
        run: flutter analyze

      - name: 프론트엔드 테스트
        working-directory: frontend
        run: flutter test